repos:
  - repo: local
    hooks:
      - id: clang-format
        name: clang-format (C)
        entry: clang-format
        args: [--dry-run, -Werror]
        language: system
        files: ^code/.*\.(c|h)$
      - id: cargo-fmt
        name: cargo fmt (Rust)
        entry: cargo fmt --check
        language: system
        files: ^code/.*/rust/
        pass_filenames: false
      - id: zig-fmt
        name: zig fmt (Zig)
        entry: zig fmt --check
        language: system
        files: ^code/.*\.zig$
        pass_filenames: false
      - id: editorconfig
        name: EditorConfig
        entry: editorconfig-checker
        language: system
        files: \.(c|h|rs|zig|md|yml|yaml)$
        pass_filenames: false
